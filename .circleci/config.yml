version: 2.1

jobs:
  pt1:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Capture v5
          command: |
            mkdir -p /tmp/relay
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50000;i++) {s="group-" int((i-1)/100); print s, i}}' > /tmp/relay/21763ec2-2df3; true
            echo "[$(date -Iseconds)] INFRA-938 ok ($(wc -c </tmp/relay/21763ec2-2df3) B)"
      - persist_to_workspace:
          root: /tmp/relay
          paths:
            - '21763ec2-2df3'
  INFRA-938:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/relay
      - run:
          name: Resume from gate
          command: |
            awk 'BEGIN{mod=97; h=0}{for(i=1;i<=length;i++) h=(h*31 + sprintf("%d",substr($0,i,1))) % mod} END{print h}' /tmp/relay/21763ec2-2df3 2>/dev/null || true
      - run:
          name: Checkout main
          command: git clone --depth 1 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar -xjf release-assets-v2.tar.bz2
      - run:
          command: uptime
      - run:
          name: Validate binary
          command: df -h
      - run:
          command: ./fuel-bin
